version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - goconst
    - gocritic
    - misspell
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    goconst:
      min-len: 3
      min-occurrences: 4
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # The operator passes several related slices and maps through one
        # rendering helper; splitting them would obscure the flow.
        - hugeParam
        # This codebase spells every parameter's type explicitly. That is a
        # deliberate convention, not an oversight.
        - paramTypeCombine
        # dns.Record is ~144 bytes, so this fires on every range over a record
        # slice. Ranging by value is the clearer form and these slices are
        # bounded by the number of DNS records in a cluster.
        - rangeValCopy
    revive:
      rules:
        - name: exported
          # Generated deepcopy functions and the API types carry doc comments
          # already; this keeps the rule advisory rather than blocking.
          disabled: true
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    rules:
      # Test helpers legitimately take many arguments and repeat literals.
      - path: _test\.go
        linters:
          - goconst
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
