name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Never publish a tag that would not have passed CI.
      - name: Run the full verification suite
        run: make verify

  release:
    name: Publish image and Helm chart
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      packages: write # push the image and chart to GHCR
      id-token: write # mint the OIDC token used to sign the provenance
      attestations: write # record build provenance for the image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set release versions
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The chart's appVersion drives the image tag it deploys, so a mismatch
      # here would ship the wrong operator version.
      - name: Check the chart version matches the tag
        run: |
          CHART_VERSION=$(grep '^version:' charts/private-dns-operator/Chart.yaml | awk '{print $2}')
          APP_VERSION=$(grep '^appVersion:' charts/private-dns-operator/Chart.yaml | awk '{print $2}')
          if [ "$CHART_VERSION" != "${{ steps.version.outputs.chart_version }}" ]; then
            echo "Chart.yaml version ($CHART_VERSION) does not match tag ${{ steps.version.outputs.chart_version }}" >&2
            exit 1
          fi
          if [ "$APP_VERSION" != "${{ steps.version.outputs.tag }}" ]; then
            echo "Chart.yaml appVersion ($APP_VERSION) does not match tag ${{ steps.version.outputs.tag }}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR for Docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/custlynotts/private-dns-operator
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=private-dns-operator
            org.opencontainers.image.description=Kubernetes-native private DNS zone management for CoreDNS
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      # Lets consumers run `gh attestation verify` against the published digest.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/custlynotts/private-dns-operator
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push Helm chart to GHCR
        run: |
          make helm-push \
            VERSION=${{ steps.version.outputs.tag }} \
            HELM_VERSION=${{ steps.version.outputs.chart_version }} \
            HELM_APP_VERSION=${{ steps.version.outputs.tag }}

      # The plain manifest install path: kubectl apply -f the release asset.
      - name: Render the install manifest
        run: make manifest-build VERSION=${{ steps.version.outputs.tag }}

      - name: Generate checksums
        run: |
          cd dist
          cp charts/*.tgz .
          sha256sum install.yaml *.tgz > checksums.txt
          cat checksums.txt

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/install.yaml
            dist/*.tgz
            dist/checksums.txt
          body: |
            ## Install

            Helm:

            ```bash
            helm upgrade --install private-dns-operator \
              oci://ghcr.io/custlynotts/charts/private-dns-operator \
              --version ${{ steps.version.outputs.chart_version }} \
              --namespace private-dns-operator-system --create-namespace
            ```

            Plain manifests:

            ```bash
            kubectl apply --server-side -f https://github.com/CustlyNotts/private-dns-operator/releases/download/${{ steps.version.outputs.tag }}/install.yaml
            ```

            ## Artifacts

            | Artifact | Reference |
            | --- | --- |
            | Image | `ghcr.io/custlynotts/private-dns-operator:${{ steps.version.outputs.tag }}` |
            | Image digest | `${{ steps.build.outputs.digest }}` |
            | Helm chart | `oci://ghcr.io/custlynotts/charts/private-dns-operator` version `${{ steps.version.outputs.chart_version }}` |

            Verify the image provenance:

            ```bash
            gh attestation verify oci://ghcr.io/custlynotts/private-dns-operator:${{ steps.version.outputs.tag }} \
              --repo CustlyNotts/private-dns-operator
            ```
